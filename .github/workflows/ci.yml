name: Validate simulation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: npm ci
      - run: npm run validate:data
      - run: npm test
      - run: npm run build
      - run: npm run simulate
      - run: npm run simulate -- demo-2026 abilities
      - run: npm run campaign:verify
